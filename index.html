<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DeniOppa — creator, streamer and content creator in Korea.">
  <title>DeniOppa</title>
  <style>
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:#0a0a0a;color:#f5f5f5;font-family:Inter,Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1100px;margin:auto;padding:0 28px}
    nav{height:82px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-size:22px;font-weight:800;letter-spacing:-.05em}
    .navlinks{display:flex;gap:25px;font-size:13px;color:#aaa}
    .navlinks a:hover{color:#fff}
    main{min-height:calc(100vh - 82px);display:flex;align-items:center}
    .hero{padding:80px 0 100px;max-width:850px}
    .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#777;margin-bottom:24px}
    h1{font-size:clamp(64px,12vw,150px);line-height:.82;margin:0 0 35px;letter-spacing:-.075em}
    .intro{font-size:clamp(20px,3vw,30px);line-height:1.3;color:#bbb;max-width:700px}
    .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:42px}
    .btn{border:1px solid #333;border-radius:999px;padding:13px 20px;font-size:14px;transition:.2s}
    .btn:hover{background:#fff;color:#000;border-color:#fff}
    .btn.primary{background:#fff;color:#000;border-color:#fff}
    section{border-top:1px solid #222;padding:70px 0}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .card{border:1px solid #222;padding:25px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
    .card span{color:#666;font-size:12px;text-transform:uppercase;letter-spacing:.12em}
    .card strong{font-size:22px}
    footer{border-top:1px solid #222;padding:30px 0;color:#666;font-size:12px}
    @media(max-width:700px){.navlinks{display:none}.grid{grid-template-columns:1fr}.hero{padding-top:50px}.wrap{padding:0 20px}}
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="logo" href="#">DeniOppa</a>
      <div class="navlinks">
        <a href="#content">Content</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>

    <main>
      <div class="hero">
        <div class="eyebrow">Creator · Streamer · Korea</div>
        <h1>DeniOppa</h1>
        <div class="intro">Content, live streams and life in Korea.</div>
        <div class="links">
          <a class="btn primary" href="https://www.tiktok.com/@denioppa_official" target="_blank">TikTok</a>
          <a class="btn" href="https://www.youtube.com/" target="_blank">YouTube</a>
          <a class="btn" href="https://www.instagram.com/denioppa_official/" target="_blank">Instagram</a>
          <a class="btn" href="https://www.twitch.tv/denioppa" target="_blank">Twitch</a>
          <a class="btn" href="https://kick.com/denioppa" target="_blank">Kick</a>
          <a class="btn" href="#contact">Contact</a>
        </div>
      </div>
    </main>

    <section id="content">
      <div class="grid">
        <a class="card" href="https://www.tiktok.com/@denioppa_official" target="_blank"><span>01</span><strong>TikTok</strong></a>
        <a class="card" href="https://www.youtube.com/" target="_blank"><span>02</span><strong>YouTube</strong></a>
        <a class="card" href="https://www.instagram.com/denioppa_official/" target="_blank"><span>03</span><strong>Instagram</strong></a>
      </div>
    </section>

    <section id="contact">
      <div class="eyebrow">Contact</div>
      <h2 style="font-size:42px;margin:0 0 20px;letter-spacing:-.04em">Let's connect.</h2>
      <a class="btn primary" href="mailto:team@denioppa.com">team@denioppa.com</a>
    </section>

    <footer>© 2026 DeniOppa. All rights reserved.</footer>
  </div>
</body>
</html>
